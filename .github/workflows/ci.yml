# CI: lint y pruebas en cada pull request a main (issue #4, T05).
# Los tests del backend NO necesitan PostgreSQL (conftest usa un repositorio
# fake en memoria) y los del frontend corren con vitest + jsdom.
name: CI

on:
  pull_request:
    branches: [main]

# Cancela ejecuciones redundantes de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias (reproducible)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.16.10

      - name: Lint (ruff)
        run: ruff check backend/ tests/

      - name: Pruebas (pytest)
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend — eslint + vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (reproducible, desde lockfile)
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Pruebas (vitest)
        working-directory: frontend
        run: npm test
