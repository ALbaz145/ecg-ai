# ECG-AI — Infraestructura local del MVP
# Proyecto escolar, NO uso clínico.
#
# Uso (desde la raíz del repo):
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps
#   docker compose down
name: ecg-ai

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_en_env}
      POSTGRES_DB: ${POSTGRES_DB:-ecg}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecg} -d ${POSTGRES_DB:-ecg}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # La DB no se expone al host: solo es accesible en la red interna.
    # Para inspeccionarla desde el host (opcional, desarrollo):
    # ports:
    #   - "127.0.0.1:5432:5432"

  backend:
    build:
      # Contexto en la raíz: la imagen necesita backend/ Y db/ (modelos y
      # migraciones Alembic) para importar db.models y ejecutar alembic.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # URL de conexión construida a partir de las variables de PostgreSQL.
      # Si se usa una DB externa, definir DATABASE_URL en .env y eliminar esta línea.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecg}:${POSTGRES_PASSWORD:-cambia_en_env}@postgres:5432/${POSTGRES_DB:-ecg}
      # Ruta del artefacto del modelo real (T11d, issue #46). Relativa al
      # WORKDIR /app: con el volumen de abajo resuelve a
      # /app/data/models/baseline.joblib (== ./data/models/baseline.joblib
      # en el host, donde lo escribe el CLI `python -m app.train_model`
      # de T11c). El artefacto no se commitea (gitignored); si falta, el
      # backend arranca igual con el heurístico (fallback con warning,
      # T11a). Se puede sobreescribir desde .env (MODEL_PATH=...).
      MODEL_PATH: ${MODEL_PATH:-data/models/baseline.joblib}
    volumes:
      # Artefacto del modelo (T11d): el backend solo LEE
      # data/models/baseline.joblib en runtime —el entrenamiento se hace
      # en el host con el CLI de T11c—, por eso montaje en solo lectura.
      # Si en algún momento hay que escribir en data/ desde dentro del
      # contenedor (p. ej. entrenar ahí), quita `:ro`.
      # Permisos: el contenedor corre como `appuser` (uid 1000, el mismo
      # que el usuario habitual del host); si un fichero no resultara
      # legible para él, model_loader emite warning y usa el heurístico
      # (no rompe el arranque ni el request).
      # Nota: si ./data no existe al hacer `up`, Docker lo crea como
      # root — crea el directorio en el host antes (mkdir -p data).
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:80" # nginx escucha en 80 dentro del contenedor
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1 y no localhost: en el contenedor localhost puede
      # resolver a ::1 (IPv6) y nginx solo escucha en 0.0.0.0:80 →
      # "Connection refused" y frontend unhealthy (D2, #70).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
    name: ecg-ai-pgdata
