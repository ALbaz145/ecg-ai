# ECG-AI — Infraestructura local del MVP
# Proyecto escolar, NO uso clínico.
#
# Uso (desde la raíz del repo):
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps
#   docker compose down
name: ecg-ai

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_en_env}
      POSTGRES_DB: ${POSTGRES_DB:-ecg}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecg} -d ${POSTGRES_DB:-ecg}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # La DB no se expone al host: solo es accesible en la red interna.
    # Para inspeccionarla desde el host (opcional, desarrollo):
    # ports:
    #   - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # URL de conexión construida a partir de las variables de PostgreSQL.
      # Si se usa una DB externa, definir DATABASE_URL en .env y eliminar esta línea.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecg}:${POSTGRES_PASSWORD:-cambia_en_env}@postgres:5432/${POSTGRES_DB:-ecg}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:80" # nginx escucha en 80 dentro del contenedor
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
    name: ecg-ai-pgdata
