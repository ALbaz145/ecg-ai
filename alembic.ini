# ECG-AI — Configuración de Alembic (migraciones de base de datos)
# Proyecto escolar, NO uso clínico.
#
# Uso (desde la raíz del repo):
#   alembic upgrade head            # aplica migraciones (necesita DB)
#   alembic downgrade -1            # revierte la última migración
#   alembic upgrade head --sql      # MODO OFFLINE: genera SQL sin DB
#   alembic current                 # revisión aplicada
#
# La URL de conexión se resuelve en db/alembic/env.py:
#   1. $DATABASE_URL si está definida (docker-compose la inyecta al backend)
#   2. Si no, se construye desde POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#      (host por defecto: localhost, para desarrollo fuera de Docker)

[alembic]
script_location = db/alembic
# file_template = %%(rev)s_%%(slug)s
# La URL aquí es un placeholder; env.py la sobreescribe con la real.
sqlalchemy.url = postgresql://usuario:clave@localhost:5432/ecg

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
